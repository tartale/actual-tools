name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # shellcheck ships on the standard ubuntu-latest runner already, but this makes sure
      # rather than letting ./actual lint silently skip shell linting (see its own fallback for
      # a machine where shellcheck really is missing) if that ever stops being true.
      - name: Ensure shellcheck is present
        run: |
          if ! command -v shellcheck &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi

      # Installed before the checks below run, same as this repo's own sandbox image does it --
      # ./actual test only skips the browser-driven tests, with a warning, when this hasn't
      # happened, which would silently drop real coverage rather than fail loudly.
      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - run: ./actual build
      - run: ./actual lint
      - run: ./actual test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build-only, no push -- catches a broken Dockerfile on every PR. The image that actually
      # gets published (see the publish job below) is built the same way, just with push: true,
      # only once a change has landed on main.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest always tracks main; :sha-<short> pins one exact build for anyone who wants a
      # specific commit rather than whatever main currently points to. The org.opencontainers.*
      # labels this generates are what let GHCR auto-link the package to this repo -- without
      # them a freshly published package sits unlinked and defaults to private, needing someone
      # to connect and re-publish it by hand in the GitHub UI before a stranger can pull it.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
